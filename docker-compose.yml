version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/ecommerce_db?schema=public"
      JWT_SECRET: "ecommerce_super_secure_jwt_secret_key_2026_!@#"
      JWT_EXPIRES_IN: "7d"
      NEXT_PUBLIC_APP_NAME: "Tagateway Admin"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      UPLOAD_DIR: "public/uploads"
    volumes:
      - uploaded_media:/app/public/uploads
      - local_data:/app/data

volumes:
  postgres_data:
    driver: local
  uploaded_media:
    driver: local
  local_data:
    driver: local
